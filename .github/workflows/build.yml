name: Build Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: filepanel-zip
          path: target/filepanel-zip-*.zip
          if-no-files-found: error
          retention-days: 14
